name: CI - Python

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f services/requirements.txt ]; then pip install -r services/requirements.txt; fi

      - name: Basic import check (fails on syntax errors)
        run: |
          python -c "import compileall; raise SystemExit(0 if compileall.compile_dir('services', quiet=1) else 1)"
