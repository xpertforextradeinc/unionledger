name: CI/CD Deploy
on:
  push:
    branches: [main]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: node --version && npm --version
      - run: npm start & sleep 5
      - run: curl --fail http://localhost:8080/ || exit 1
      - run: curl -s http://localhost:8080/api/trading/status || exit 1
      # Optionally: Add deployment commands (Railway, Render deploy hooks)
