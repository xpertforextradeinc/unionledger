name: CI - Node

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
