name: Monetization Link Injection

on:
  push:
    branches:
      - main
    paths:
      - 'public/**/*.html'
  workflow_dispatch:

jobs:
  inject-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Inject affiliate links
        env:
          AFFILIATE_CONFIG: ${{ secrets.AFFILIATE_CONFIG }}
        run: node automation/monetization-injector.js

      - name: Commit changes
        run: |
          git config user.name "paymint-bot"
          git config user.email "bot@paymint.global"
          git add public/
          git commit -m "💰 Monetization links injected" || echo "No changes"
          git push origin main
